stages:
  - validate
  - info

terraform-validate:
  stage: validate
  image: 
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate

afficher-environnement:
  stage: info
  image: alpine:latest
  script:
    - 'echo "Deploiement cible: $APP_ENV"'